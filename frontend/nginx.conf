# Solo el WebSocket del progreso (/api/ws/progress) se actualiza; el resto de
# /api/ son peticiones normales. Mandando "Connection: upgrade" en todas, un
# GET corriente llega al backend con una combinacion de cabeceras invalida y la
# conexion no se reutiliza: cada tramo de video abre un TCP nuevo (y un
# handshake TLS si viene de fuera), y un <video> pide muchos tramos.
map $http_upgrade $conexion_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Resolucion perezosa del backend: con `proxy_pass http://backend:8000`
    # nginx resuelve el nombre al arrancar y, si el backend aun no existe,
    # se cae con "host not found in upstream" y el contenedor entra en bucle.
    # Con la variable resuelve en cada peticion (502 mientras tanto, pero vive).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming de video: sin buffer ni limite de tiempo.
        proxy_buffering off;
        proxy_read_timeout 3600;
    }

    # PWA de movil: vive en /m/ con su propio index.html y service worker.
    location = /m { return 301 /m/; }
    location /m/ {
        alias /usr/share/nginx/html/m/;
        try_files $uri $uri/ /m/index.html;
        add_header Service-Worker-Allowed "/m/";
    }
    location = /m/manifest.webmanifest {
        alias /usr/share/nginx/html/m/manifest.webmanifest;
        default_type application/manifest+json;
    }
    location = /m/sw.js {
        alias /usr/share/nginx/html/m/sw.js;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/m/";
    }

    # La app de television, servida.
    #
    # Las teles (Samsung, LG, Fire TV) llevan instalado un paquete que es solo
    # el arranque: comprueba si esto contesta y carga la interfaz de aqui, asi
    # que se actualizan solas al abrirlas. Ver tv/README.md.
    location = /tv { return 301 /tv/; }
    location /tv/ {
        alias /usr/share/nginx/html/tv/;
        # La app navega con hash (#/peliculas), asi que esto es solo una red de
        # seguridad para quien recargue con una ruta pegada.
        try_files $uri $uri/ /tv/index.html;
        # Sin esto, una tele podia quedarse con el index viejo en su cache
        # aunque los assets nuevos ya estuvieran aqui, que es exactamente lo
        # que este /tv/ viene a arreglar. Va en todo el bloque y no solo en el
        # index porque lo que pide la app es "/tv/", y ahi responde el indice
        # del directorio: una cabecera puesta en `location = /tv/index.html` no
        # llegaria a aplicarse nunca. A los assets les cuesta una
        # revalidacion (dos ficheros, y en la LAN eso no se nota).
        add_header Cache-Control "no-cache";
    }

    # App de TV para el navegador de la PlayStation 4: el mismo codigo que la
    # app de Samsung/LG/Fire TV, compilado para WebKit. Se sirve desde aqui y
    # no desde un paquete para que la API quede en el mismo origen: asi no hay
    # que escribir la IP del servidor dentro del bundle ni abrir CORS.
    location = /ps4 { return 301 /ps4/; }
    location /ps4/ {
        alias /usr/share/nginx/html/ps4/;
        # La app navega con hash (#/peliculas), asi que esto es solo una red
        # de seguridad para quien recargue con una ruta pegada.
        try_files $uri $uri/ /ps4/index.html;
    }

    # Service worker de la web de escritorio. No cachea nada de la app: esta
    # solo para los avisos de episodios nuevos. Sin "no-cache" el navegador se
    # puede quedar con una copia vieja hasta un dia entero.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
