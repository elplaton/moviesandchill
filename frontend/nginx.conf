server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming de video: sin buffer ni limite de tiempo.
        proxy_buffering off;
        proxy_read_timeout 3600;
    }

    # PWA de movil: vive en /m/ con su propio index.html y service worker.
    location = /m { return 301 /m/; }
    location /m/ {
        alias /usr/share/nginx/html/m/;
        try_files $uri $uri/ /m/index.html;
        add_header Service-Worker-Allowed "/m/";
    }
    location = /m/manifest.webmanifest {
        alias /usr/share/nginx/html/m/manifest.webmanifest;
        default_type application/manifest+json;
    }
    location = /m/sw.js {
        alias /usr/share/nginx/html/m/sw.js;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/m/";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
