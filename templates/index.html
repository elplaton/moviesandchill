<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Movie Downloader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { color: #58a6ff; margin-bottom: 5px; }
        .subtitle { color: #8b949e; margin-bottom: 20px; font-size: 14px; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .search-bar {
            display: flex;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            padding: 10px 15px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 15px;
            outline: none;
        }
        .search-bar input:focus { border-color: #58a6ff; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primary { background: #238636; color: #fff; }
        .btn-primary:hover { background: #2ea043; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-download { background: #1f6feb; color: #fff; padding: 6px 14px; font-size: 13px; }
        .btn-download:hover { background: #388bfd; }
        .btn-download:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
        .btn-download.downloaded { background: #21262d; color: #3fb950; cursor: default; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #21262d; }
        th { color: #8b949e; font-weight: 600; font-size: 13px; }
        td { font-size: 14px; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #21262d;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-fill {
            height: 100%;
            background: #238636;
            border-radius: 3px;
            transition: width 0.3s;
        }
        .progress-fill-part {
            height: 100%;
            background: #1f6feb;
            border-radius: 3px;
            transition: width 0.3s;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-downloading { background: #1f6feb22; color: #58a6ff; }
        .status-extracting { background: #d2992222; color: #d29922; }
        .status-converting { background: #6e40c922; color: #c084fc; }
        .status-done { background: #23863622; color: #3fb950; }
        .status-error { background: #da363322; color: #f85149; }
        .status-pending { background: #8b949e22; color: #8b949e; }
        .file-list { list-style: none; }
        .file-list li { padding: 8px 12px; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
        .file-list .folder-icon { color: #d29922; }
        .file-list .file-icon { color: #8b949e; }
        .folder-link { cursor: pointer; color: #58a6ff; }
        .folder-link:hover { text-decoration: underline; }
        .sub-file-list {
            list-style: none;
            padding: 0 0 0 24px;
            margin: 0 0 0 12px;
            border-left: 2px solid #30363d;
            width: 100%;
            flex-basis: 100%;
        }
        .sub-file-list li {
            padding: 5px 0 5px 12px;
            border-bottom: 1px solid #21262d;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            position: relative;
            min-width: 0;
        }
        .sub-file-list li::before {
            content: '';
            position: absolute;
            left: -2px;
            top: 14px;
            width: 12px;
            height: 2px;
            background: #30363d;
        }
        .sub-file-list li:last-child {
            border-bottom: none;
        }
        .sub-file-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-name.expanded {
            white-space: normal;
            word-break: break-word;
        }
        .file-list li.expanded {
            align-items: flex-start;
        }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #f0f6fc; }
        .no-results { color: #8b949e; text-align: center; padding: 30px; }
        .disk-info { font-size: 13px; color: #8b949e; margin-bottom: 15px; }
        .folder-name { color: #d29922; font-weight: 500; }
        .batch-card {
            background: #1c2128;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .batch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .batch-parts { margin-top: 8px; }
        .part-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 4px 0;
            color: #8b949e;
        }
        .part-name { flex: 1; word-break: break-all; }
        .part-size { flex-shrink: 0; }
        .small-progress {
            width: 100px;
            height: 4px;
            background: #21262d;
            border-radius: 2px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .small-progress-fill {
            height: 100%;
            background: #1f6feb;
            border-radius: 2px;
            transition: width 0.3s;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 14px;
        }
        .page-btn {
            padding: 5px 12px;
            font-size: 13px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            cursor: pointer;
        }
        .page-btn:hover { background: #30363d; }
        .page-btn.active { background: #1f6feb; border-color: #388bfd; color: #fff; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-delete {
            background: #da3633;
            color: #fff;
            padding: 3px 10px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
        }
        .btn-delete:hover { background: #f85149; }
        .btn-play {
            background: #1f6feb;
            color: #fff;
            padding: 3px 10px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
        }
        .btn-play:hover { background: #388bfd; }
        .btn-cancel {
            background: #d29922;
            color: #fff;
            padding: 3px 10px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
        }
        .btn-cancel:hover { background: #e2a52a; }
        .btn-pause {
            background: #6e40c9;
            color: #fff;
            padding: 3px 10px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
        }
        .btn-pause:hover { background: #845ecf; }
        .btn-resume {
            background: #238636;
            color: #fff;
            padding: 3px 10px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
        }
        .btn-resume:hover { background: #2ea043; }
        .channel-chip {
            padding: 3px 10px;
            font-size: 12px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            color: #8b949e;
            cursor: pointer;
            white-space: nowrap;
        }
        .channel-chip.active { background: #1f6feb; border-color: #388bfd; color: #fff; }
        .channel-badge {
            display: inline-block;
            font-size: 10px;
            background: #30363d;
            color: #8b949e;
            padding: 2px 6px;
            border-radius: 8px;
            margin-left: 4px;
            vertical-align: middle;
        }
        .sort-header { cursor: pointer; user-select: none; }
        .sort-header:hover { color: #58a6ff; }
        .sort-arrow { font-size: 10px; margin-left: 2px; }
    </style>
</head>
<body>
    <h1>Telegram Movie Downloader</h1>
    <p class="subtitle">Busca y descarga peliculas y series desde tu canal de Telegram</p>

    <div class="card">
        <div class="disk-info" id="diskInfo">Cargando...</div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar pelicula o serie..." autofocus>
            <button class="btn btn-primary" id="searchBtn" onclick="doSearch()">Buscar</button>
        </div>
        <div id="searchStatus"></div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;" id="channelFilter"></div>
    </div>

    <div class="card" id="resultsCard" style="display:none;">
        <div class="section-title">Resultados (<span id="resultCount">0</span>)</div>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Archivo</th>
                        <th>Tamaño</th>
                        <th class="sort-header" onclick="toggleSort()" title="Ordenar por fecha">Fecha <span id="sortArrow" class="sort-arrow">▼</span></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

    <div class="card" id="activeCard" style="display:none;">
        <div class="section-title">Descargas activas</div>
        <div id="activeDownloads"></div>
    </div>

    <div class="card" id="pausedCard" style="display:none;">
        <div class="section-title">Descargas pausadas</div>
        <div id="pausedDownloads"></div>
    </div>

    <div class="card">
        <div class="section-title">Archivos descargados</div>
        <ul class="file-list" id="fileList">
            <li class="no-results">Cargando...</li>
        </ul>
    </div>

    <script>
        let ws = null;
        let activeBatches = {};
        let _lastSearchResults = [];
        let _currentQuery = '';
        let _offsets = [0];
        let _pageIndex = 0;
        let _hasMore = false;
        let _pageSize = 8;
        let _sortAsc = false;
        let _selectedChannels = [];
        let _availableChannels = [];

        function connectWS() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(protocol + '//' + location.host + '/ws/progress');
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'batch_update') {
                    if (data.status === 'done' && data.downloaded_parts !== undefined) {
                        const b = activeBatches[data.batch_id];
                        if (b) {
                            b.downloaded_parts = data.downloaded_parts;
                            b.overall_progress = data.overall_progress || b.overall_progress;
                        }
                    } else if (data.part_message_id) {
                        const b = activeBatches[data.batch_id];
                        if (b && b.parts) {
                            const part = b.parts.find(p => p.message_id === data.part_message_id);
                            if (part) part.status = data.status;
                        }
                    }
                } else if (data.type === 'batch_progress') {
                    const b = activeBatches[data.batch_id];
                    if (b) {
                        b.overall_progress = data.overall_progress;
                        if (b.parts && data.part_message_id) {
                            const part = b.parts.find(p => p.message_id === data.part_message_id);
                            if (part) {
                                part.progress = data.part_progress;
                                if (data.part_progress >= 100) part.status = 'done';
                            }
                        }
                    }
                } else if (data.type === 'batch_status') {
                    const b = activeBatches[data.batch_id];
                    if (b) {
                        b.status = data.status;
                        b.error = data.error;
                        if (data.extracted_files) b.extracted_files = data.extracted_files;
                        if (data.folder_name) b.folder_name = data.folder_name;
                        if (data.parts) {
                            for (const sp of data.parts) {
                                const part = b.parts.find(p => p.message_id === sp.message_id);
                                if (part) {
                                    part.status = sp.status;
                                    part.error = sp.error;
                                }
                            }
                        }
                    }
                    if (data.status === 'done' || data.status === 'error' || data.status === 'cancelled') {
                        loadFiles();
                        setTimeout(() => {
                            const b = activeBatches[data.batch_id];
                            if (b && (b.status === 'done' || b.status === 'error' || b.status === 'cancelled')) {
                                delete activeBatches[data.batch_id];
                            }
                            renderActiveBatches();
                        }, 10000);
                    }
                }
                renderActiveBatches();
                renderResults(_lastSearchResults);
            };
            ws.onclose = () => { setTimeout(connectWS, 3000); };
        }

        async function loadChannels() {
            try {
                const res = await fetch('/api/channels');
                const data = await res.json();
                _availableChannels = data.channels || [];
                renderChannelFilter();
            } catch (err) {}
        }

        function toggleChannel(id) {
            if (id === null || _selectedChannels.length === 1 && _selectedChannels[0] === id) {
                _selectedChannels = [];
            } else {
                _selectedChannels = [id];
            }
            renderChannelFilter();
            if (_currentQuery) doSearch('first');
        }

        function renderChannelFilter() {
            const container = document.getElementById('channelFilter');
            const allMode = _selectedChannels.length === 0;
            let html = `<button class="channel-chip ${allMode ? 'active' : ''}" onclick="toggleChannel(null)">Todos</button>`;
            for (const ch of _availableChannels) {
                html += `<button class="channel-chip ${allMode || (_selectedChannels.length === 1 && _selectedChannels[0] === ch.id) ? 'active' : ''}" onclick="toggleChannel(${ch.id})">${ch.name}</button>`;
            }
            container.innerHTML = html;
        }

        function toggleSort() {
            _sortAsc = !_sortAsc;
            document.getElementById('sortArrow').innerHTML = _sortAsc ? '▲' : '▼';
            if (_currentQuery) doSearch('first');
        }

        async function doSearch(direction = 'first') {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                document.getElementById('resultsCard').style.display = 'none';
                document.getElementById('pagination').innerHTML = '';
                document.getElementById('searchStatus').textContent = '';
                document.getElementById('resultCount').textContent = '0';
                _lastSearchResults = [];
                _offsets = [0];
                _pageIndex = 0;
                return;
            }

            let offset = 0;
            if (direction === 'first') {
                _currentQuery = query;
                _offsets = [0];
                _pageIndex = 0;
            } else if (direction === 'next') {
                _pageIndex++;
                offset = _offsets[_pageIndex] || 0;
            } else if (direction === 'prev') {
                _pageIndex--;
                offset = _offsets[_pageIndex] || 0;
            }

            const btn = document.getElementById('searchBtn');
            const status = document.getElementById('searchStatus');
            btn.disabled = true;
            status.textContent = 'Buscando...';

            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: _currentQuery, offset_id: offset, page_size: _pageSize, sort_asc: _sortAsc, channel_ids: _selectedChannels.length > 0 ? _selectedChannels : null }),
                });
                const data = await res.json();
                _lastSearchResults = data.results;
                _hasMore = data.has_more;
                if (data.has_more && _offsets.length <= _pageIndex + 1) {
                    _offsets.push(data.last_message_id);
                }
                renderResults(data.results);
                document.getElementById('resultCount').textContent = data.count;
                document.getElementById('resultsCard').style.display = '';
                status.textContent = data.count === 0 ? 'Sin resultados' : `${data.count} resultados`;
                renderPagination();
            } catch (err) {
                status.textContent = 'Error al buscar';
            } finally {
                btn.disabled = false;
            }
        }

        function renderResults(results) {
            if (!results) return;
            const tbody = document.getElementById('resultsBody');
            if (!results || results.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="no-results">Sin resultados</td></tr>';
                return;
            }
            tbody.innerHTML = results.map(r => {
                const batch = findBatchForMessage(r.id);
                let btnText = 'Descargar';
                let btnClass = '';
                let disabled = '';
                if (r.downloaded) {
                    btnText = 'Descargado';
                    btnClass = ' downloaded';
                    disabled = 'disabled';
                } else if (batch) {
                    if (batch.status === 'downloading') { btnText = 'Descargando...'; disabled = 'disabled'; }
                    else if (batch.status === 'extracting') { btnText = 'Extrayendo...'; disabled = 'disabled'; }
                    else if (batch.status === 'done') { btnText = 'Completado'; disabled = 'disabled'; }
                    else if (batch.status === 'error') { btnText = 'Error'; disabled = 'disabled'; }
                }
                return `<tr>
                    <td title="${r.text || ''}">${r.file_name || 'Sin nombre'}${r.channel_name ? `<span class="channel-badge">${r.channel_name}</span>` : ''}${r.text ? '<br><small style="color:#8b949e">' + escapeHtml(r.text.substring(0, 80)) + '</small>' : ''}</td>
                    <td>${r.size_str}</td>
                    <td>${r.date ? r.date.substring(0, 10) : '-'}</td>
                    <td><button class="btn btn-download${btnClass}" onclick="startDownload(${r.id}, ${r.channel_id || 0})" ${disabled}>${btnText}</button></td>
                </tr>`;
            }).join('');
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            if (!_hasMore && _pageIndex === 0) {
                container.innerHTML = '';
                return;
            }
            let html = '';
            html += `<button class="page-btn" onclick="doSearch('prev')" ${_pageIndex === 0 ? 'disabled' : ''}>&laquo; Anterior</button>`;
            html += ` <span style="color:#8b949e;font-size:13px;margin:0 8px;">Pag ${_pageIndex + 1}</span> `;
            html += `<button class="page-btn" onclick="doSearch('next')" ${!_hasMore ? 'disabled' : ''}>Siguiente &raquo;</button>`;
            container.innerHTML = html;
        }

        function findBatchForMessage(msgId) {
            for (const [bid, b] of Object.entries(activeBatches)) {
                if (b.parts) {
                    for (const p of b.parts) {
                        if (p.message_id === msgId) return b;
                    }
                }
            }
            return null;
        }

        async function startDownload(messageId, channelId) {
            try {
                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message_id: messageId, channel_id: channelId || null }),
                });
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                    return;
                }
                if (data.batch_id) {
                    activeBatches[data.batch_id] = {
                        batch_id: data.batch_id,
                        folder_name: data.folder_name,
                        status: 'downloading',
                        total_parts: data.total_parts,
                        downloaded_parts: 0,
                        overall_progress: 0,
                        parts: data.parts.map(p => ({
                            message_id: p.message_id,
                            file_name: p.file_name,
                            status: 'pending',
                            progress: 0,
                        })),
                    };
                    renderActiveBatches();
                    renderResults(_lastSearchResults);
                }
            } catch (err) {
                alert('Error al iniciar descarga: ' + err.message);
            }
        }

        function renderActiveBatches() {
            const container = document.getElementById('activeDownloads');
            const card = document.getElementById('activeCard');
            const entries = Object.values(activeBatches);
            if (entries.length === 0) {
                card.style.display = 'none';
                return;
            }
            card.style.display = '';

            container.innerHTML = entries.map(b => {
                const pct = b.overall_progress || 0;
                let statusClass = 'status-downloading';
                let statusText = 'Descargando';
                if (b.status === 'extracting') { statusClass = 'status-extracting'; statusText = 'Descomprimiendo'; }
                if (b.status === 'converting') { statusClass = 'status-converting'; statusText = 'Convirtiendo audio'; }
                if (b.status === 'done') { statusClass = 'status-done'; statusText = 'Completado'; }
                if (b.status === 'error') { statusClass = 'status-error'; statusText = 'Error'; }
                if (b.status === 'cancelling') { statusClass = 'status-error'; statusText = 'Cancelando...'; }
                if (b.status === 'cancelled') { statusClass = 'status-error'; statusText = 'Cancelada'; }

                let partsHtml = '';
                if (b.total_parts > 1 && b.parts) {
                    partsHtml = '<div class="batch-parts">' + b.parts.map(p => {
                        let pStatus = '';
                        if (p.status === 'done') pStatus = '<span style="color:#3fb950">&#10003;</span>';
                        else if (p.status === 'downloading') pStatus = `<span style="color:#58a6ff">${p.progress}%</span>`;
                        else if (p.status === 'error') pStatus = `<span style="color:#f85149">&#10007; ${p.error || ''}</span>`;
                        else pStatus = '<span style="color:#8b949e">pendiente</span>';
                        return `<div class="part-row">
                            <span class="part-name">${p.file_name}</span>
                            <span class="part-size">${pStatus}</span>
                            ${p.status === 'downloading' ? `<div class="small-progress"><div class="small-progress-fill" style="width:${p.progress}%"></div></div>` : ''}
                        </div>`;
                    }).join('') + '</div>';
                }

                let extractedHtml = '';
                if (b.extracted_files && b.extracted_files.length) {
                    extractedHtml = '<div style="font-size:12px;color:#3fb950;margin-top:4px;">Archivos: ' + b.extracted_files.map(f => f.split('/').pop()).join(', ') + '</div>';
                }

                let errorHtml = '';
                if (b.error) {
                    errorHtml = `<div style="color:#f85149;font-size:12px;margin-top:4px;">${b.error}</div>`;
                }

                let infoText = `<span class="folder-name">${b.folder_name || 'Descargando...'}</span>`;
                if (b.total_parts > 1) {
                    infoText += ` <span style="color:#8b949e;font-size:12px;">(${b.downloaded_parts || 0}/${b.total_parts} partes)</span>`;
                }

                return `<div class="batch-card">
                    <div class="batch-header">
                        <span style="font-size:14px;">${infoText}</span>
                        <span class="status-badge ${statusClass}">${statusText} ${statusText === 'Descargando' ? pct + '%' : ''}</span>
                    </div>
                    ${(b.status === 'downloading' || b.status === 'converting') ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>` : ''}
                    ${partsHtml}
                    ${extractedHtml}
                    ${errorHtml}
                    ${b.status === 'downloading' ? `<div style="text-align:right;margin-top:8px;"><button class="btn-pause" onclick="pauseBatch('${b.batch_id}')" title="Pausar descarga">Pausar</button> <button class="btn-cancel" onclick="cancelBatch('${b.batch_id}')" title="Cancelar descarga">Cancelar</button></div>` : ''}
                </div>`;
            }).join('');
        }

        async function loadFiles() {
            try {
                const res = await fetch('/api/files');
                const data = await res.json();
                const list = document.getElementById('fileList');
                if (!data.files || data.files.length === 0) {
                    list.innerHTML = '<li class="no-results">No hay archivos descargados</li>';
                    return;
                }
                list.innerHTML = data.files.map(f => {
                    if (f.is_dir) {
                        return `<li data-folder="${escapeHtml(f.name)}"><span class="folder-icon">&#128193;</span> <span class="folder-link file-name" onclick="toggleFolder(this.parentElement)" title="${escapeHtml(f.name)}">${f.name}</span> <span style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;"><span style="color:#8b949e;font-size:12px;">${f.size}</span><button class="btn-delete" onclick="event.stopPropagation();deleteFile('${escapeHtml(f.path)}')" title="Eliminar">Borrar</button></span></li>`;
                    }
                    return `<li><span class="file-icon">&#128196;</span> <span class="file-name" title="${escapeHtml(f.name)}">${f.name}</span> <span style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;"><span style="color:#8b949e;font-size:12px;">${f.size}</span>${renderPlayButton(f.path, f.name)}<button class="btn-delete" onclick="deleteFile('${escapeHtml(f.path)}')" title="Eliminar">Borrar</button></span></li>`;
                }).join('');
            } catch (err) {
                document.getElementById('fileList').innerHTML = '<li class="no-results">Error al cargar</li>';
            }
        }

        function isVideo(name) {
            return /\.(mkv|mp4|avi|ts|mov|webm|m4v|flv|wmv)$/i.test(name);
        }

        function isIOSPlayable(name) {
            return /\.(mp4|mov|m4v)$/i.test(name);
        }

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        function getVlcUrl(fullPath) {
            return 'vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(location.origin + '/api/stream?path=' + encodeURIComponent(fullPath));
        }

        function playFile(path) {
            window.open('/api/stream?path=' + encodeURIComponent(path), '_blank');
        }

        function renderPlayButton(fullPath, fileName) {
            if (!isVideo(fileName)) return '';
            if (isIOS() && !isIOSPlayable(fileName)) {
                return `<a href="${getVlcUrl(fullPath)}" class="btn-play" style="display:inline-block;text-decoration:none;" title="Abrir en VLC" onclick="event.stopPropagation();">▶</a>`;
            }
            return `<button class="btn-play" onclick="event.stopPropagation();playFile('${escapeHtml(fullPath)}')" title="Reproducir">▶</button>`;
        }

        async function deleteFile(path) {
            if (!confirm('¿Eliminar "' + path.split('/').pop() + '"?')) return;
            try {
                const res = await fetch('/api/files', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path }),
                });
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                } else {
                    loadFiles();
                }
            } catch (err) {
                alert('Error al eliminar: ' + err.message);
            }
        }

        async function toggleFolder(li) {
            const name = li.dataset.folder;
            const icon = li.querySelector('.folder-icon');
            const fileName = li.querySelector('.file-name');
            const existing = li.querySelector('.sub-file-list');
            if (existing) {
                existing.remove();
                if (icon) icon.innerHTML = '&#128193;';
                if (fileName) fileName.classList.remove('expanded');
                li.classList.remove('expanded');
                return;
            }
            if (icon) icon.innerHTML = '&#128194;';
            if (fileName) fileName.classList.add('expanded');
            li.classList.add('expanded');
            try {
                const res = await fetch('/api/files?subpath=' + encodeURIComponent(name));
                const data = await res.json();
                const ul = document.createElement('ul');
                ul.className = 'sub-file-list';
                if (!data.files || data.files.length === 0) {
                    ul.innerHTML = '<li style="color:#8b949e;">Vacia</li>';
                } else {
                    ul.innerHTML = data.files.map(f => {
                        const ficon = f.is_dir ? '<span style="color:#d29922;">&#128193;</span>' : '<span style="color:#8b949e;">&#128196;</span>';
                        return `<li>${ficon} <span class="sub-file-name" title="${escapeHtml(f.name)}">${f.name}</span> <span style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;"><span style="color:#8b949e;font-size:11px;">${f.size}</span>${renderPlayButton(f.path, f.name)}<button class="btn-delete" onclick="event.stopPropagation();deleteSubFile('${escapeHtml(f.path)}','${escapeHtml(name)}')" title="Eliminar">Borrar</button></span></li>`;
                    }).join('');
                }
                li.appendChild(ul);
            } catch (err) {
                if (icon) icon.innerHTML = '&#128193;';
                if (fileName) fileName.classList.remove('expanded');
                li.classList.remove('expanded');
            }
        }

        async function deleteSubFile(path, folderName) {
            if (!confirm('¿Eliminar "' + path.split('/').pop() + '"?')) return;
            try {
                const res = await fetch('/api/files', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path }),
                });
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                } else {
                    await loadFiles();
                    for (const el of document.querySelectorAll('li[data-folder]')) {
                        if (el.dataset.folder === folderName) {
                            toggleFolder(el);
                            break;
                        }
                    }
                }
            } catch (err) {
                alert('Error al eliminar: ' + err.message);
            }
        }

        async function cancelBatch(batchId) {
            if (!confirm('¿Cancelar la descarga en curso?')) return;
            try {
                const res = await fetch('/api/cancel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ batch_id: batchId }),
                });
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                } else {
                    const b = activeBatches[batchId];
                    if (b) b.status = 'cancelling';
                    renderActiveBatches();
                }
            } catch (err) {
                alert('Error al cancelar: ' + err.message);
            }
        }

        async function pauseBatch(batchId) {
            if (!confirm('¿Pausar la descarga? Podras reanudarla mas tarde.')) return;
            try {
                const res = await fetch('/api/pause', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ batch_id: batchId }),
                });
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                } else {
                    delete activeBatches[batchId];
                    renderActiveBatches();
                    loadResumableBatches();
                }
            } catch (err) {
                alert('Error al pausar: ' + err.message);
            }
        }

        async function resumeBatch(batchId) {
            try {
                const res = await fetch('/api/resume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ batch_id: batchId }),
                });
                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                    return;
                }
                if (data.batch_id) {
                    activeBatches[data.batch_id] = {
                        batch_id: data.batch_id,
                        folder_name: data.folder_name,
                        status: 'downloading',
                        total_parts: data.total_parts,
                        downloaded_parts: 0,
                        overall_progress: 0,
                        parts: data.parts.map(p => ({
                            message_id: p.message_id,
                            file_name: p.file_name,
                            status: 'pending',
                            progress: 0,
                        })),
                    };
                    renderActiveBatches();
                    loadResumableBatches();
                }
            } catch (err) {
                alert('Error al reanudar: ' + err.message);
            }
        }

        async function loadResumableBatches() {
            try {
                const res = await fetch('/api/resumable');
                const data = await res.json();
                if (data.batches) {
                    window._pausedBatches = {};
                    for (const b of data.batches) {
                        window._pausedBatches[b.batch_id] = b;
                    }
                }
                renderPausedBatches();
            } catch (err) {}
        }

        function renderPausedBatches() {
            const container = document.getElementById('pausedDownloads');
            const card = document.getElementById('pausedCard');
            const batches = window._pausedBatches || {};
            const entries = Object.values(batches);
            if (entries.length === 0) {
                card.style.display = 'none';
                return;
            }
            card.style.display = '';
            container.innerHTML = entries.map(b => {
                const doneParts = b.parts.filter(p => p.status === 'done').length;
                return `<div class="batch-card">
                    <div class="batch-header">
                        <span style="font-size:14px;"><span class="folder-name">${b.folder_name || ''}</span> <span style="color:#8b949e;font-size:12px;">(${doneParts}/${b.total_parts} partes)</span></span>
                        <span class="status-badge status-pending">Pausada</span>
                    </div>
                    <div style="text-align:right;margin-top:8px;">
                        <button class="btn-resume" onclick="resumeBatch('${b.batch_id}')" title="Reanudar descarga">Reanudar</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function loadDiskInfo() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('diskInfo').textContent = 'Espacio libre en disco: ' + data.disk_free;
            } catch (err) {
                document.getElementById('diskInfo').textContent = '';
            }
        }

        async function loadActiveBatches() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                for (const b of data.active_batches) {
                    if (!activeBatches[b.batch_id]) {
                        activeBatches[b.batch_id] = {
                            batch_id: b.batch_id,
                            folder_name: b.folder_name,
                            status: b.status,
                            total_parts: b.total_parts,
                            downloaded_parts: b.downloaded_parts,
                            overall_progress: b.progress,
                            error: b.error,
                            parts: b.parts.map(p => ({
                                message_id: p.message_id,
                                file_name: p.file_name,
                                status: p.status,
                                progress: p.progress,
                            })),
                        };
                    }
                }
                renderActiveBatches();
            } catch (err) {}
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });
        document.getElementById('searchInput').addEventListener('input', (e) => {
            if (!e.target.value.trim()) {
                document.getElementById('resultsCard').style.display = 'none';
                document.getElementById('pagination').innerHTML = '';
                document.getElementById('searchStatus').textContent = '';
                document.getElementById('resultCount').textContent = '0';
                _lastSearchResults = [];
                _offsets = [0];
                _pageIndex = 0;
            }
        });

        connectWS();
        loadChannels();
        loadActiveBatches();
        loadResumableBatches();
        loadFiles();
        loadDiskInfo();
        setInterval(loadDiskInfo, 60000);
    </script>
    <div style="text-align:right;padding:0 20px 10px;"><a href="/settings" style="color:#484f58;font-size:10px;text-decoration:none;margin-right:10px;">Config</a><a href="/dev" style="color:#484f58;font-size:10px;text-decoration:none;">Dev</a></div>
</body>
</html>
