<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Logs · Telegram Movie Downloader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #0f0; font-family: 'Courier New', monospace; padding: 10px; font-size: 12px; }
        .toolbar {
            display: flex; gap: 8px; padding: 8px; background: #111;
            border: 1px solid #333; border-radius: 4px; margin-bottom: 8px;
            flex-wrap: wrap; align-items: center;
        }
        .toolbar select, .toolbar input, .toolbar button {
            background: #1a1a1a; border: 1px solid #333; color: #0f0;
            padding: 4px 8px; font: 12px monospace; border-radius: 4px; outline: none;
        }
        .toolbar button { cursor: pointer; }
        .toolbar button:hover { background: #222; }
        .toolbar input:focus { border-color: #0f0; }
        .toolbar select { cursor: pointer; }
        .toolbar .spacer { flex: 1; }
        .toolbar .counter { color: #666; font-size: 11px; }
        #logContainer {
            height: calc(100vh - 60px); overflow-y: auto; white-space: pre-wrap;
            background: #050505; border: 1px solid #333; border-radius: 4px; padding: 8px;
            word-break: break-all;
        }
        #logContainer::-webkit-scrollbar { width: 6px; }
        #logContainer::-webkit-scrollbar-track { background: #050505; }
        #logContainer::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .log-error { color: #f44; }
        .log-warning { color: #fa0; }
        .log-debug { color: #666; }
        .back-link { color: #666; text-decoration: none; font-size: 11px; }
        .back-link:hover { color: #0f0; }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="/" class="back-link">← Volver</a>
        <select id="lineCount" onchange="fetchLogs()">
            <option value="50">50 líneas</option>
            <option value="100" selected>100 líneas</option>
            <option value="200">200 líneas</option>
            <option value="500">500 líneas</option>
        </select>
        <input type="text" id="filter" placeholder="Filtrar..." oninput="fetchLogs()">
        <button id="pauseBtn" onclick="togglePause()">
            <span id="pauseIcon">⏸</span> <span id="pauseLabel">Pausar</span>
        </button>
        <button onclick="scrollToBottom()" title="Ir al final">⬇</button>
        <span class="counter" id="logCounter">0 líneas</span>
    </div>
    <div id="logContainer"></div>

    <script>
        let pollingInterval = null;
        let paused = false;
        let autoScroll = true;

        const container = document.getElementById('logContainer');
        container.addEventListener('scroll', () => {
            autoScroll = container.scrollHeight - container.scrollTop - container.clientHeight < 40;
        });

        async function fetchLogs() {
            const lines = document.getElementById('lineCount').value;
            const filter = document.getElementById('filter').value.toLowerCase();
            try {
                const res = await fetch(`/api/logs?lines=${lines}`);
                const data = await res.json();
                let html = '';
                for (const line of data.logs) {
                    if (filter && !line.toLowerCase().includes(filter)) continue;
                    let cls = '';
                    if (line.includes('ERROR') || line.includes('error')) cls = 'log-error';
                    else if (line.includes('WARNING') || line.includes('WARN')) cls = 'log-warning';
                    else if (line.includes('DEBUG')) cls = 'log-debug';
                    html += `<div class="${cls}">${escapeHtml(line)}</div>`;
                }
                container.innerHTML = html || '<div style="color:#666;">Sin resultados</div>';
                if (autoScroll) container.scrollTop = container.scrollHeight;
                document.getElementById('logCounter').textContent = data.count + ' líneas';
            } catch (err) {
                container.innerHTML = '<div class="log-error">Error cargando logs</div>';
            }
        }

        function togglePause() {
            paused = !paused;
            document.getElementById('pauseIcon').textContent = paused ? '▶' : '⏸';
            document.getElementById('pauseLabel').textContent = paused ? 'Reanudar' : 'Pausar';
            if (!paused) fetchLogs();
        }

        function scrollToBottom() {
            autoScroll = true;
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        fetchLogs();
        pollingInterval = setInterval(() => { if (!paused) fetchLogs(); }, 3000);
    </script>
</body>
</html>
